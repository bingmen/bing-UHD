# github.com/shenjuexiao
# 20261023

# .github/workflows/bing-UHD-simple.yml
name: bing-UHD-simple

on:
  workflow_dispatch:
    inputs:
      year:
        description: "年份 (year)，留空则使用当前年份"
        required: false
        default: ""
        type: string
      mkt:
        description: "市场 (mkt)，all 表示全部"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - de-DE
          - en-CA
          - en-GB
          - en-IN
          - en-US
          - fr-FR
          - it-IT
          - ja-JP
          - zh-CN
  schedule:
    # 每天 UTC 0 点自动运行（北京时间 8 点）
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: bing-UHD-simple-${{ github.event_name }}-${{ inputs.year || 'auto' }}-${{ inputs.mkt || 'all' }}
  cancel-in-progress: false

jobs:
  build:
    name: Fetch JSON & Build Markdown (${{ matrix.mkt }} / ${{ inputs.year || 'auto' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mkt:
          - de-DE
          - en-CA
          - en-GB
          - en-IN
          - en-US
          - fr-FR
          - it-IT
          - ja-JP
          - zh-CN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Resolve inputs (year / mkt)
        id: vars
        run: |
          # year：手动输入优先；为空则取当前 UTC 年份
          YEAR="${{ inputs.year }}"
          if [ -z "$YEAR" ]; then
            YEAR="$(date -u +'%Y')"
          fi

          # mkt：手动输入优先；为空（schedule 触发）则 all
          MKT="${{ inputs.mkt }}"
          if [ -z "$MKT" ]; then
            MKT="all"
          fi

          echo "YEAR=$YEAR" >> "$GITHUB_ENV"
          echo "MKT=$MKT"   >> "$GITHUB_ENV"
          echo "resolved year=$YEAR mkt=$MKT"

      - name: Skip non-selected market
        id: gate
        run: |
          if [ "${MKT}" = "all" ] || [ "${MKT}" = "${{ matrix.mkt }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run fetch & build script
        if: steps.gate.outputs.run == 'true'
        run: |
          python bing-UHD-simple.py \
            --mkt "${{ matrix.mkt }}" \
            --year "${YEAR}"

      - name: Commit and push changes
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "bing-UHD-${YEAR}/bing-JSON-${{ matrix.mkt }}-${YEAR}.json" \
                  "bing-UHD-${YEAR}/bing-JSON-${{ matrix.mkt }}-${YEAR}" \
                  "bing-UHD-${YEAR}/bing-UHD-${{ matrix.mkt }}-${YEAR}.md" || true

          if git diff --cached --quiet; then
            echo "没有变更需要提交。"
            exit 0
          fi

          git commit -m "chore: update bing UHD simple ${{ matrix.mkt }} ${YEAR} ($(date -u +'%Y-%m-%d %H:%M:%S') UTC)"

          for i in 1 2 3 4 5; do
            git push origin HEAD && break
            echo "push 失败，第 $i 次重试……"
            git pull --rebase origin HEAD || true
            sleep 5
          done
