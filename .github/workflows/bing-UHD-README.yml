# .github/workflows/bing-UHD-README.yml
name: bing-UHD-README

on:
  workflow_dispatch:
  workflow_run:
    # 必须和 simple 工作流的 name 完全一致
    workflows: ["bing-UHD-simple"]   
    types: [completed]
  schedule:
    - cron: "23 1 * * *"

permissions:
  contents: write

concurrency:
  group: bing-UHD-README
  cancel-in-progress: false

jobs:
  build-readme:
    # 仅当 simple 成功（或手动/定时触发）时才构建
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          # workflow_run 场景下需显式指定 simple 工作流的 ref/sha
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run bing-UHD-README
        run: |
          python bing-UHD-README.py --out-dir . --seed 42

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: update bing-UHD README ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash || true
            sleep 5
          done
          exit 1
