# .github/workflows/bing-UHD-cn.yml
name: bing-UHD-cn
on:
  schedule:
    # 每天 00:05 UTC 运行（北京时间 08:05）
    - cron: '5 0 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        run: python bing-UHD-cn.py

      - name: Commit and push changes
        run: |
          git config --local user.email "shenjuexiao@qq.com"
          git config --local user.name "shenjuexiao"
          YEAR=$(date +%Y)
          git add bing-UHD-cn-${YEAR}.md bing-JSON-cn-${YEAR}.json bing-UHD-cn-${YEAR}/ bing-320-cn-${YEAR}/ bing-JSON-cn-${YEAR}/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Bing UHD CN wallpapers [skip ci]"
          fi
          # 先同步远程，再推送
          git pull --rebase origin main
          git push origin main
